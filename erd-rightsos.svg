<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 920" font-family="ui-monospace,'SF Mono','GeistMono',Menlo,monospace" role="img" aria-label="RightsOS core data model entity-relationship diagram">
<defs>
